name: "Release Pipeline"

# Thin caller of the shared reusable release-tag workflow in supertokens/actions.
# The shared five-job release skeleton (setup, register-version, mark-as-success,
# release, merge — including the post-release dev sync) lives once in the
# reusable workflow; only auth-react's ecosystem follow-ups (docs publish + npm
# publish) remain here and consume the reusable workflow's outputs via `needs`.
#
# sdk_type: frontend — the shared workflow registers this SDK against
# api.supertokens.io/0/frontend with the supported FDI versions and the web-js
# interface version (instead of the driver CDI arrays).
#
# npm publishing uses npm trusted publishing (OIDC) — no NPM_TOKEN secret. The
# trusted publisher on npmjs.com must be configured for this repo, this
# workflow file (pipeline-release-tag.yml) and the `publish` environment.
#
# These release paths only run when a dev-sync release PR (release/vX.Y.Z) is
# merged into a version branch, or on manual dispatch — CI on a normal PR cannot
# exercise them.

on:
    pull_request:
        types: [closed]
        branches:
            - "[0-9]+.[0-9]+"

    workflow_dispatch:
        inputs:
            branch:
                description: The branch to create the release tag on
                type: string
                required: true

            skip-test-checks:
                description: Skip tests passed checks
                type: boolean
                default: false
                required: false

            skip-other-version-checks:
                description: Skip server checks for core and frontend versions
                type: boolean
                default: false
                required: false

permissions:
    contents: write
    pull-requests: read

jobs:
    release-pipeline:
        uses: supertokens/actions/.github/workflows/release-tag.yml@main
        secrets: inherit
        with:
            sdk_name: auth-react
            sdk_type: frontend
            branch: ${{ inputs.branch || '' }}
            skip-test-checks: ${{ inputs.skip-test-checks || false }}
            skip-other-version-checks: ${{ inputs.skip-other-version-checks || false }}
            # Must cover every .changie.yaml replacement target so the release
            # changelog commit stages the bumped version files.
            changelog_add_paths: ".changes/ CHANGELOG.md package.json package-lock.json lib/ts/version.ts"

    publish-docs:
        runs-on: ubuntu-latest
        needs:
            - release-pipeline

        steps:
            - uses: actions/create-github-app-token@v2
              id: app-token
              with:
                  app-id: ${{ vars.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  owner: supertokens
                  # This job checks out and dispatches a workflow in
                  # supertokens-backend-website in addition to this repo.
                  repositories: |
                      ${{ github.event.repository.name }}
                      supertokens-backend-website

            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-pipeline.outputs.releaseTag }}
                  fetch-tags: true
                  path: supertokens-auth-react

            - uses: actions/checkout@v4
              with:
                  repository: supertokens/supertokens-backend-website
                  token: ${{ steps.app-token.outputs.token }}
                  path: supertokens-backend-website

            - run: |
                  shopt -s extglob # Enable extended globbing

                  targetFolder=app/docs/sdk/docs/auth-react

                  if [[ "${{ needs.release-pipeline.outputs.isLatest }}" == "true" ]]
                  then
                      # Delete everything except the version folders
                      rm -rf supertokens-backend-website/${targetFolder}/!(*.*.X)
                      # Copy files to the root dir
                      cp -r supertokens-auth-react/docs/* supertokens-backend-website/${targetFolder}/
                  fi

                  # Delete the current version folder if it exists
                  rm -rf supertokens-backend-website/${targetFolder}/${{ needs.release-pipeline.outputs.versionXy }}.X
                  # Copy the current docs
                  mkdir -p supertokens-backend-website/${targetFolder}/${{ needs.release-pipeline.outputs.versionXy }}.X
                  cp -r supertokens-auth-react/docs/* supertokens-backend-website/${targetFolder}/${{ needs.release-pipeline.outputs.versionXy }}.X

            - uses: actions/upload-artifact@v4
              with:
                  name: auth-react-docs-${{ needs.release-pipeline.outputs.version }}
                  path: supertokens-backend-website/app/docs/sdk/docs/auth-react

            - name: Trigger the backend website CI
              uses: actions/github-script@v7
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      github.rest.actions.createWorkflowDispatch({
                          owner: 'supertokens',
                          repo: 'supertokens-backend-website',
                          workflow_id: 'release-sdk-documentation-changes.yml',
                          ref: 'master',
                          inputs: {
                              "sdk-name": "auth-react",
                              "sdk-repo": "supertokens/supertokens-auth-react",
                              "version": `${{ needs.release-pipeline.outputs.version }}`,
                              "artifact-name": `auth-react-docs-${{ needs.release-pipeline.outputs.version }}`,
                              "target-folder": `app/docs/sdk/docs/auth-react`,
                              "run-id": `${{ github.run_id }}`,
                              "stage":  "production",
                          }
                      })

    publish:
        runs-on: ubuntu-latest
        # The publish environment gates this job behind approval and is part of
        # the npm trusted publisher configuration.
        environment: publish
        permissions:
            id-token: write # Required for npm trusted publishing (OIDC)
            contents: read
        needs:
            - release-pipeline

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-pipeline.outputs.releaseTag }}
                  fetch-tags: true

            # NOTE: no registry-url here on purpose — setup-node's .npmrc
            # references NODE_AUTH_TOKEN, which is unset with trusted
            # publishing and would make npm error out.
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"

            # Trusted publishing requires npm >= 11.5.1; the npm bundled with
            # the runner's Node version may lag behind.
            - run: npm install -g npm@latest && npm --version

            - run: |
                  if [[ "${{ needs.release-pipeline.outputs.isLatest }}" == "true" ]]
                  then
                      npm publish --tag latest
                  else
                      npm publish --tag version-${{ needs.release-pipeline.outputs.version }}
                  fi
