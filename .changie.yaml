changesDir: .changes
unreleasedDir: unreleased
headerPath: header.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.VersionNoPrefix}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: "### {{.Kind}}"
changeFormat: "-   {{.Body}}"

kinds:
    - label: Added
      auto: minor
    - label: Changed
      auto: patch
    - label: Fixed
      auto: patch
    - label: Breaking Changes
      auto: minor
    - label: Infrastructure
      auto: none
    - label: Deprecated
      auto: patch
    - label: Removed
      auto: minor
    - label: Security
      auto: patch

newlines:
    afterChangelogHeader: 1
    afterKind: 1
    beforeKind: 1
    beforeChangelogVersion: 0
    endOfVersion: 2

# package-lock.json and lib/build/ are intentionally NOT replacement targets:
# the dev-sync `prepare` step runs `npm install` (which syncs the lock file's
# version fields from package.json) and rebuilds lib/build/ + docs/ from the
# bumped sources.
replacements:
    - path: package.json
      find: '"version": "[0-9]+\.[0-9]+\.[0-9]+"'
      replace: '"version": "{{.VersionNoPrefix}}"'
      flags: ""
    - path: lib/ts/version.ts
      find: 'export const package_version = "[0-9]+\.[0-9]+\.[0-9]+"'
      replace: 'export const package_version = "{{.VersionNoPrefix}}"'
      flags: ""
